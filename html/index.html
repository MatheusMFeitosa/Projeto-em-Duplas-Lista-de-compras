<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercadão Brothers</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav>
        <h1>Brothers</h1>
        <div class="menu-lateral">
            <header>
                <h3>Filtros</h3>
                <i class="fa-solid fa-xmark" id="botao_menu"></i>
            </header>
            <ul>
                <ul>
                    <li><input type="checkbox" name="filtros" value="alimentos"> Alimentos</li>
                    <li><input type="checkbox" name="filtros" value="limpeza"> Produtos de limpeza</li>
                    <li><input type="checkbox" name="filtros" value="brinquedos"> Brinquedos</li>
                </ul>
            </ul>
            <div class="acoes-menu-lateral">
                <button onclick="filtrarProdutos()">Aplicar filtros</button>
                <button onclick="removerFiltros()">Remover  filtros</button>
            </div>
        </div>

        <div class="conteiner-barra-pesquisa">
            <label for="barra_pesquisa">
                <input type="search" name="pesquisa" id="barra_pesquisa" placeholder="Pesquise aqui..." />
                <i class="fa-solid fa-magnifying-glass"></i>
            </label>
        </div>
        <div class="menu-usuario">
            <i class="fa-solid fa-circle-user"></i>
            <i class="fa-solid fa-cart-shopping"></i>
        </div>
    </nav>

    <main></main>

    <script src="../scripts/index.js"></script>
    <script src="https://kit.fontawesome.com/bf19b5ff3e.js" crossorigin="anonymous"></script>
</body>
</html>
